services:
  backend:
    build: ./backend
    container_name: innovatech-backend
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=admin123
      - DB_NAME=innovatech_db
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: innovatech-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  db:
    image: mysql:8
    container_name: innovatech-db
    environment:
      MYSQL_ROOT_PASSWORD: admin123
      MYSQL_DATABASE: innovatech_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin123"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db_data: